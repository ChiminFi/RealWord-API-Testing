[project]
name = "realword-api-tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ChiminFi", email = "pax-wan@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
realword-api-tests = "realword_api_tests:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.38.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
    "ruff>=0.16.7",
    "types-requests>=2.33.0.20260906",
]
